# ─────────────────────────────────────────
# Application
# ─────────────────────────────────────────
spring.application.name=ai-interview-simulator

# ─────────────────────────────────────────
# MySQL Database (XAMPP)
# ─────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/ai_interview_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─────────────────────────────────────────
# JPA / Hibernate
# ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ─────────────────────────────────────────
# JWT Configuration
# ─────────────────────────────────────────
jwt.secret=ai_interview_simulator_super_secret_key_2024_springboot_security
jwt.expiration=86400000

# ─────────────────────────────────────────
# Ollama / Gemma3 (Local)
# ─────────────────────────────────────────
ollama.base-url=http://localhost:11434
ollama.model=gemma3:1b


# ─────────────────────────────────────────
# CORS (React Frontend)
# ─────────────────────────────────────────
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ─────────────────────────────────────────
# Server Port
# ─────────────────────────────────────────
server.port=8080

# ─────────────────────────────────────────
# Conversation Limit
# ─────────────────────────────────────────
interview.message.limit=20

# ─────────────────────────────────────────
# Ollama timeout settings
# ─────────────────────────────────────────
ollama.connect-timeout=120000
ollama.read-timeout=300000

# ─────────────────────────────────────────
# WebSocket Configuration
# ─────────────────────────────────────────
spring.websocket.path=/ws
websocket.broker.topic=/topic
websocket.broker.queue=/queue
websocket.app.prefix=/app

# ─────────────────────────────────────────
# Error handling
# ─────────────────────────────────────────
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# Enable NoHandlerFoundException for 404 handling
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false